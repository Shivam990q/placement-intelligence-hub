name: 📡 Scheduled Placement Watchdog Scraper

on:
  schedule:
    # Runs every 30 minutes automatically
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime!

jobs:
  scrape-and-ingest:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Career Portals & Community Scraper
        env:
          EDGE_API_URL: ${{ secrets.EDGE_API_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          python scripts/scheduled_scraper.py
